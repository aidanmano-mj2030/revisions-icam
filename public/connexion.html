<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Connexion | Studicam</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
    :root { color-scheme: dark; }
    *, *::before, *::after { box-sizing: border-box; }
    html, body { margin: 0; }
    body {
        min-height: 100vh; min-height: 100dvh;
        display: flex; align-items: center; justify-content: center;
        padding: 24px 16px;
        background: #0a0f1d; color: #e2e8f0;
        font-family: 'Inter', system-ui, -apple-system, 'Segoe UI', sans-serif;
        -webkit-font-smoothing: antialiased;
        overflow-x: hidden;
    }
    main { width: 100%; max-width: 420px; }
    .marque { display: flex; align-items: center; gap: 12px; justify-content: center; margin-bottom: 28px; }
    .logo {
        width: 44px; height: 44px; border-radius: 12px; flex-shrink: 0;
        background: linear-gradient(to top right, #2563eb, #6366f1);
        display: flex; align-items: center; justify-content: center;
        box-shadow: 0 10px 15px -3px rgba(59, 130, 246, .2);
    }
    h1 { margin: 0; font-size: 2rem; font-weight: 800; letter-spacing: -0.02em; color: #fff; }
    h1 span { background: linear-gradient(to right, #60a5fa, #818cf8); -webkit-background-clip: text; background-clip: text; color: transparent; }
    .sous-titre { margin: 4px 0 0; font-size: .9rem; color: #94a3b8; }
    .carte {
        background: #161e2e; border: 1px solid #27354a; border-radius: 16px;
        padding: 24px; box-shadow: 0 20px 25px -5px rgba(0, 0, 0, .35);
    }
    .bouton {
        display: flex; align-items: center; justify-content: center; gap: 10px;
        width: 100%; padding: 12px 16px; border-radius: 12px;
        background: #fff; color: #1f2937; font-weight: 700; font-size: .95rem; text-decoration: none;
        transition: background-color .15s;
    }
    .bouton:hover { background: #e2e8f0; }
    .bouton:focus-visible { outline: 2px solid #93c5fd; outline-offset: 2px; }
    .erreur {
        margin: 12px 0 0; padding: 10px 12px; border-radius: 10px;
        border: 1px solid rgba(239, 68, 68, .4); background: rgba(239, 68, 68, .1);
        color: #fecaca; font-size: .85rem; line-height: 1.45;
    }
    .erreur[hidden] { display: none; }
    .mention { margin: 16px 0 0; font-size: .8rem; line-height: 1.5; color: #94a3b8; text-align: center; }
    @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>
<main>
    <div class="marque">
        <div class="logo" aria-hidden="true">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21.42 10.922a1 1 0 0 0-.019-1.838L12.83 5.18a2 2 0 0 0-1.66 0L2.6 9.08a1 1 0 0 0 0 1.832l8.57 3.908a2 2 0 0 0 1.66 0z"/><path d="M22 10v6"/><path d="M6 12.5V16a6 3 0 0 0 12 0v-3.5"/></svg>
        </div>
        <div>
            <h1><span>Studicam</span></h1>
            <p class="sous-titre">Révisions ICAM, promos A1 et A2</p>
        </div>
    </div>

    <div class="carte">
        <a id="bouton" class="bouton" href="/api/google/debut">
            <svg width="18" height="18" viewBox="0 0 48 48" aria-hidden="true"><path fill="#FFC107" d="M43.6 20.1H42V20H24v8h11.3C33.7 32.7 29.2 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.8 1.2 7.9 3.1l5.7-5.7C34 6.1 29.3 4 24 4 12.9 4 4 12.9 4 24s8.9 20 20 20 20-8.9 20-20c0-1.3-.1-2.6-.4-3.9z"/><path fill="#FF3D00" d="m6.3 14.7 6.6 4.8C14.7 15.1 19 12 24 12c3.1 0 5.8 1.2 7.9 3.1l5.7-5.7C34 6.1 29.3 4 24 4 16.3 4 9.7 8.3 6.3 14.7z"/><path fill="#4CAF50" d="M24 44c5.2 0 9.9-2 13.4-5.2l-6.2-5.2C29.2 35.1 26.7 36 24 36c-5.2 0-9.6-3.3-11.3-7.9l-6.5 5C9.5 39.6 16.2 44 24 44z"/><path fill="#1976D2" d="M43.6 20.1H42V20H24v8h11.3c-.8 2.2-2.2 4.2-4.1 5.6l6.2 5.2C37 39.2 44 34 44 24c0-1.3-.1-2.6-.4-3.9z"/></svg>
            Se connecter avec mon compte ICAM
        </a>
        <p id="erreur" class="erreur" role="alert" hidden></p>
        <p id="mention" class="mention">Connexion par Google, avec ton adresse @icam.fr. Studicam ne garde que ton adresse et ta progression.</p>
    </div>
</main>
<script>
    (function () {
        const messages = {
            annule: 'Connexion annulée. Réessaie quand tu veux.',
            compte: 'Utilise ton compte ICAM (…@icam.fr). Les comptes Google personnels ne sont pas acceptés.',
            expire: 'La connexion a pris trop de temps. Réessaie.',
            limite: 'Trop de connexions en ce moment, attends une minute.',
            google: "Google n'a pas confirmé la connexion. Réessaie dans un instant.",
            config: "La connexion n'est pas encore configurée sur ce site."
        };
        const code = new URLSearchParams(location.search).get('erreur');
        if (code) {
            const erreur = document.getElementById('erreur');
            erreur.textContent = messages[code] || 'La connexion a échoué, réessaie.';
            erreur.hidden = false;
        }
    })();
</script>
</body>
</html>
